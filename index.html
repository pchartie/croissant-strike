<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FPS1</title>
  </head>
  <body>
    <div id="damage"></div>
    <div id="hud">
      <div id="crosshair">
        <span class="top"></span><span class="bottom"></span>
        <span class="left"></span><span class="right"></span>
      </div>
      <div id="hitmarker"></div>
      <div id="score"></div>
      <div id="killfeed"></div>
      <div id="health"><span class="cross">+</span> <span id="health-value">100</span></div>
      <div id="speed">0</div>
      <div id="ammo">
        <div id="weapon-name"></div>
        <div><span id="ammo-count">0</span> <span class="sep">/</span> <span id="ammo-reserve">0</span></div>
      </div>
    </div>

    <div id="death" class="hidden"><p id="death-text"></p></div>

    <div id="overlay">
      <div class="panel">
        <h1>FPS1</h1>
        <p id="overlay-status">Cliquer pour jouer</p>
        <div class="settings">
          <button id="setting-bots" class="toggle" type="button"></button>
          <button id="setting-aggressive" class="toggle" type="button"></button>
        </div>
        <ul class="controls">
          <li><span><kbd>Z</kbd><kbd>Q</kbd><kbd>S</kbd><kbd>D</kbd></span> se déplacer</li>
          <li><span><kbd>Souris</kbd></span> viser</li>
          <li><span><kbd>Clic gauche</kbd></span> tirer</li>
          <li><span><kbd>R</kbd></span> recharger</li>
          <li><span><kbd>1</kbd><kbd>2</kbd></span> fusil / pistolet</li>
          <li><span><kbd>Espace</kbd> / <kbd>Molette</kbd></span> sauter</li>
          <li><span><kbd>Ctrl</kbd> / <kbd>C</kbd></span> s'accroupir</li>
          <li><span><kbd>Maj</kbd></span> marcher lentement</li>
          <li><span><kbd>Échap</kbd></span> pause</li>
        </ul>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

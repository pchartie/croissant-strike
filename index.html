<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🥐 Croissant Strike</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥐</text></svg>" />
  </head>
  <body>
    <div id="vignette"></div>
    <div id="damage"></div>
    <div id="scope-overlay" class="hidden"></div>
    <div id="smoke-overlay"></div>
    <div id="flash-overlay"></div>
    <div id="hud">
      <div id="crosshair" class="crosshair">
        <span class="top"></span><span class="bottom"></span>
        <span class="left"></span><span class="right"></span>
      </div>
      <div id="hitmarker"></div>
      <div id="score"></div>
      <div id="round"><span id="round-score"></span><span id="round-timer"></span><span id="round-alive"></span></div>
      <div id="banner" class="hidden"><div id="banner-title"></div><div id="banner-text"></div></div>
      <div id="killfeed"></div>
      <div id="money"></div>
      <!-- Vie et gilet : icône, valeur, jauge. -->
      <div id="health" class="hud-panel">
        <div class="vital"><img id="health-icon" class="vital-icon" alt="" /><span id="health-value">100</span><span class="bar"><i id="health-bar"></i></span></div>
        <div id="armor" class="vital"><img id="armor-icon" class="vital-icon" alt="" /><span id="armor-value">0</span><span class="bar"><i id="armor-bar"></i></span></div>
      </div>
      <div id="buy-menu" class="hidden"></div>
      <div id="scoreboard" class="hidden"></div>
      <canvas id="radar" width="180" height="180"></canvas>
      <div id="fps"></div>
      <div id="frozen" class="hidden">Bots figés · <kbd>P</kbd> pour les relancer</div>
      <div id="grenades"></div>
      <div id="ammo" class="hud-panel">
        <div id="weapon-name"></div>
        <div class="ammo-numbers"><span id="ammo-count">0</span><span class="sep">/</span><span id="ammo-reserve">0</span></div>
      </div>
    </div>

    <div id="death" class="hidden"><p id="death-text"></p></div>

    <div id="resume" class="hidden"><p>Clique pour reprendre <span>· Échap : menu</span></p></div>

    <div id="overlay">
      <div class="panel menu">
        <header class="menu-header">
          <h1><span class="title-emoji">🥐</span> <span class="title-accent">Croissant</span> Strike</h1>
        </header>
        <!-- Rubriques à gauche (Partie, En ligne, Contrôles…), leurs options à droite. -->
        <div id="settings" class="menu-body"></div>
        <div id="online"></div>
        <footer class="menu-footer">
          <p class="menu-hint">En jeu, <kbd>Échap</kbd> ouvre ce menu</p>
          <button id="play" class="play" type="button">Jouer</button>
        </footer>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
